<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="580" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a2e" letter-spacing="-0.3">IMDb Analytics — Data Pipeline</text>
  <text x="580" y="55" text-anchor="middle" font-size="11.5" fill="#6b7280" letter-spacing="1.3">~200M RECORDS · 7 DATASETS · AZURE DATA FACTORY · SNOWFLAKE · POWER BI</text>

  <!-- Flow arrows (behind cards) -->
  <g stroke="#9ca3af" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="222" y1="215" x2="262" y2="215"/>
    <line x1="447" y1="215" x2="487" y2="215"/>
    <line x1="672" y1="215" x2="712" y2="215"/>
    <line x1="897" y1="215" x2="937" y2="215"/>
  </g>

  <!-- 01 SOURCE -->
  <rect x="40" y="110" width="180" height="210" rx="14" fill="#EEF1F6" stroke="#475569" stroke-width="1.5"/>
  <text x="56" y="137" font-size="10.5" font-weight="700" fill="#475569" letter-spacing="1">01 · SOURCE</text>
  <text x="56" y="163" font-size="15" font-weight="700" fill="#1a1a2e">IMDb Raw Data</text>
  <g font-size="11.5" fill="#4b5563">
    <text x="56" y="192">.tsv.gz compressed</text>
    <text x="56" y="214">7 public datasets</text>
    <text x="56" y="236">~200M records</text>
  </g>

  <!-- 02 TRANSFORM -->
  <rect x="265" y="110" width="180" height="210" rx="14" fill="#FDEEEA" stroke="#E8531A" stroke-width="1.5"/>
  <text x="281" y="137" font-size="10.5" font-weight="700" fill="#E8531A" letter-spacing="1">02 · TRANSFORM</text>
  <text x="281" y="163" font-size="15" font-weight="700" fill="#1a1a2e">Profile &amp; Clean</text>
  <g font-size="11.5" fill="#4b5563">
    <text x="281" y="192">Alteryx + Python</text>
    <text x="281" y="214">\N → NULL placeholders</text>
    <text x="281" y="236">cast &amp; validate types</text>
  </g>

  <!-- 03 ORCHESTRATE -->
  <rect x="490" y="110" width="180" height="210" rx="14" fill="#EAF0FE" stroke="#2563eb" stroke-width="1.5"/>
  <text x="506" y="137" font-size="10.5" font-weight="700" fill="#2563eb" letter-spacing="1">03 · ORCHESTRATE</text>
  <text x="506" y="163" font-size="15" font-weight="700" fill="#1a1a2e">Azure Data Factory</text>
  <g font-size="11.5" fill="#4b5563">
    <text x="506" y="192">dependency-aware loads</text>
    <text x="506" y="214">error handling</text>
    <text x="506" y="236">automated re-runs</text>
  </g>

  <!-- 04 WAREHOUSE -->
  <rect x="715" y="110" width="180" height="210" rx="14" fill="#E9FBF6" stroke="#0B8A7C" stroke-width="1.5"/>
  <text x="731" y="137" font-size="10.5" font-weight="700" fill="#0B8A7C" letter-spacing="1">04 · WAREHOUSE</text>
  <text x="731" y="160" font-size="15" font-weight="700" fill="#1a1a2e">Snowflake</text>
  <g>
    <rect x="731" y="172" width="148" height="56" rx="9" fill="#ffffff" stroke="#0B8A7C" stroke-width="1"/>
    <text x="745" y="192" font-size="11.5" font-weight="700" fill="#1a1a2e">Staging</text>
    <text x="745" y="211" font-size="10.5" fill="#6b7280">7 cleaned tables</text>
    <line x1="805" y1="228" x2="805" y2="242" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="731" y="244" width="148" height="56" rx="9" fill="#ffffff" stroke="#0B8A7C" stroke-width="1"/>
    <text x="745" y="264" font-size="11.5" font-weight="700" fill="#1a1a2e">Curated</text>
    <text x="745" y="283" font-size="10.5" fill="#6b7280">dimensions + facts</text>
  </g>

  <!-- 05 SERVE -->
  <rect x="940" y="110" width="180" height="210" rx="14" fill="#EDEBFC" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="956" y="137" font-size="10.5" font-weight="700" fill="#4f46e5" letter-spacing="1">05 · SERVE</text>
  <text x="956" y="163" font-size="15" font-weight="700" fill="#1a1a2e">Dashboards</text>
  <g font-size="11.5" fill="#4b5563">
    <text x="956" y="192">Power BI + Tableau</text>
    <text x="956" y="214">genre &amp; rating trends</text>
    <text x="956" y="236">cast / crew analysis</text>
  </g>

  <!-- Data quality band -->
  <rect x="40" y="350" width="1080" height="44" rx="12" fill="#0f0e0c"/>
  <text x="580" y="377" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff" letter-spacing="0.5">DATA QUALITY  ·  row-count reconciliation  ·  primary-key uniqueness  ·  type consistency  ·  BI sanity checks</text>

  <!-- Dataset caption -->
  <text x="580" y="424" text-anchor="middle" font-size="10.5" fill="#9ca3af">Datasets: title.basics · name.basics · title.akas · title.principals · title.crew · title.episode · title.ratings</text>
</svg>
