<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" width="1160" height="500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="580" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a2e" letter-spacing="-0.3">Food Inspection Analytics — Medallion Pipeline</text>
  <text x="580" y="53" text-anchor="middle" font-size="11.5" fill="#6b7280" letter-spacing="1.3">MULTI-CITY · BRONZE → SILVER → GOLD · DATABRICKS · SNOWFLAKE · TABLEAU</text>

  <!-- ADF orchestration band -->
  <rect x="265" y="92" width="630" height="30" rx="15" fill="#EAF0FE" stroke="#2563eb" stroke-width="1.3"/>
  <text x="580" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1.2">AZURE DATA FACTORY · ORCHESTRATION</text>
  <g stroke="#93c5fd" stroke-width="1.5">
    <line x1="355" y1="122" x2="355" y2="140"/>
    <line x1="580" y1="122" x2="580" y2="140"/>
    <line x1="805" y1="122" x2="805" y2="140"/>
  </g>

  <!-- Flow arrows -->
  <g stroke="#9ca3af" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="222" y1="245" x2="262" y2="245"/>
    <line x1="447" y1="245" x2="487" y2="245"/>
    <line x1="672" y1="245" x2="712" y2="245"/>
    <line x1="897" y1="245" x2="937" y2="245"/>
  </g>

  <!-- 01 SOURCES -->
  <rect x="40" y="140" width="180" height="210" rx="14" fill="#EEF1F6" stroke="#475569" stroke-width="1.5"/>
  <text x="56" y="167" font-size="10.5" font-weight="700" fill="#475569" letter-spacing="1">01 · SOURCES</text>
  <rect x="56" y="180" width="148" height="56" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="70" y="201" font-size="12" font-weight="700" fill="#1a1a2e">Chicago</text>
  <text x="70" y="220" font-size="10.5" fill="#6b7280">long · piped violations</text>
  <rect x="56" y="242" width="148" height="56" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="70" y="263" font-size="12" font-weight="700" fill="#1a1a2e">Dallas</text>
  <text x="70" y="282" font-size="10.5" fill="#6b7280">wide · 25 blocks/row</text>

  <!-- 02 BRONZE -->
  <rect x="265" y="140" width="180" height="210" rx="14" fill="#FBEBDD" stroke="#B45309" stroke-width="1.5"/>
  <text x="281" y="167" font-size="10.5" font-weight="700" fill="#B45309" letter-spacing="1">02 · BRONZE — RAW</text>
  <text x="281" y="193" font-size="15" font-weight="700" fill="#1a1a2e">Data Lake Gen2</text>
  <g font-size="11.5" fill="#4b5563">
    <text x="281" y="222">raw CSV / TSV</text>
    <text x="281" y="244">stored unmodified</text>
    <text x="281" y="266">auditable</text>
  </g>

  <!-- 03 SILVER -->
  <rect x="490" y="140" width="180" height="210" rx="14" fill="#EEF1F6" stroke="#64748B" stroke-width="1.5"/>
  <text x="506" y="167" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="1">03 · SILVER — CLEAN</text>
  <text x="506" y="193" font-size="15" font-weight="700" fill="#1a1a2e">Databricks</text>
  <g font-size="11.5" fill="#4b5563">
    <text x="506" y="222">PySpark → Parquet</text>
    <text x="506" y="244">city-specific transforms</text>
    <text x="506" y="266">merge → unified staging</text>
  </g>

  <!-- 04 GOLD -->
  <rect x="715" y="140" width="180" height="210" rx="14" fill="#FBF3D9" stroke="#A16207" stroke-width="1.5"/>
  <text x="731" y="167" font-size="10.5" font-weight="700" fill="#A16207" letter-spacing="1">04 · GOLD — MODELED</text>
  <text x="731" y="193" font-size="15" font-weight="700" fill="#1a1a2e">Snowflake</text>
  <g font-size="11.5" fill="#4b5563">
    <text x="731" y="222">Dynamic Tables</text>
    <text x="731" y="244">star schema</text>
    <text x="731" y="266">fact_inspections + 4 dims</text>
  </g>

  <!-- 05 SERVE -->
  <rect x="940" y="140" width="180" height="210" rx="14" fill="#EDEBFC" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="956" y="167" font-size="10.5" font-weight="700" fill="#4f46e5" letter-spacing="1">05 · SERVE</text>
  <text x="956" y="193" font-size="15" font-weight="700" fill="#1a1a2e">Tableau</text>
  <g font-size="11.5" fill="#4b5563">
    <text x="956" y="222">risk hotspots</text>
    <text x="956" y="244">cross-city trends</text>
    <text x="956" y="266">facility history</text>
  </g>

  <!-- Lineage band -->
  <rect x="40" y="380" width="1080" height="44" rx="12" fill="#0f0e0c"/>
  <text x="580" y="407" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff" letter-spacing="0.4">LINEAGE  ·  every record tagged with  source · job_id · load_dt  ·  incremental refresh via Snowflake Dynamic Tables</text>

  <!-- Caption -->
  <text x="580" y="454" text-anchor="middle" font-size="10.5" fill="#9ca3af">Medallion architecture · Chicago Dept. of Public Health + Dallas Code Compliance Services</text>
</svg>
